<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="{% url 'accounts:mypage' %}">뒤로 가기</a>
    <hr>

    {% for post in my_posts %}
        <a href="{% url 'posts:detail' id=post.id %}">
            <h3>{{ post.title }}</h3>
        </a>
        
        <p>{{ post.content }}</p>
        
        <p>작성일 - {{ post.created_at|date:"F d, Y, g:i a." }}</p>
        <p>작성자 - {{ post.author.username }}</p>
        <hr>
    {% empty %}
        <p>작성한 글이 없습니다.</p>
    {% endfor %}
</body>
</html>
