<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% for post in posts %}
        <a href="{% url 'posts:detail' post.id %}">
            <h2>{{ post.title }}</h2>
        </a>
        <p>{{ post.content }}</p>
        <p>작성일: {{ post.created_at }}</p>
        <p>작성자: {{ post.author.nickname }}</p>
    {% endfor %}
    
</body>
</html>
