<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="{% url 'posts:main' %}">메인페이지로 돌아가기</a>
        {% for post in posts %}
        <h2>{{post.title}}</h2>
        <p>{{post.content}}</p>
        <p>{{post.created_at}}</p> 
        <p>작성자 - {{post.author.nickname}}</p>
    {% empty %}
        <p>스크랩한 글이 없습니다.</p>
    {% endfor %}
</body>
</html>
