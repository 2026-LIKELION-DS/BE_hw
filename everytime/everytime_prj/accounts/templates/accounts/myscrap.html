<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href = "{% url 'posts:main' %}">메인 페이지로 돌아가기</a><br>
    <h2>내가 스트랩한 글!</h2>
    {% for post in scrapped_posts %}
    <h2><a href = "{% url 'posts:detail' post.id %}">{{ post.title }}</a></h2>
    {{ post.content }}<br><br>
    {{ post.created_at|date }}<br><br>
    {% if post.is_anonymous %}
        익명
    {% else %}
        {{ post.author.nickname }}
    {% endif %}
    {% empty %}
        스크랩 한 글이 없습니다. 
    {% endfor %}

</body>
</html>
