<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="{% url 'posts:main' %}">메인페이지로 돌아가기</a><br>
    <h1>내가 스크랩한 글!</h1>
    {% for post in posts %}
    <h2>
        <a href="{% url 'posts:detail' post.id %}">
            {{ post.title }}
        </a>
    </h2>

    <p>{{ post.content }}</p>

    <p>작성일- {{ post.created_at }}</p>

    {% if post.is_anonymous %}
        <p>작성자 - 익명</p>
    {% else %}
        <p>작성자 - {{ post.author.nickname }}</p>
    {% endif %}
    {% endfor %}
</body>
</html>
