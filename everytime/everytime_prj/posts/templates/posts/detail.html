<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="{% url 'everytime:main' %}">메인페이지로 돌아가기</a><br>
    <p>nickname : {{ post.nickname }}</p>

    <hr />
    <br />
    {% if request.user == post.author %}
    <a href="{% url 'blog:update' post.id %}">수정하기</a><br>
    <a href="{% url 'blog:delete' post.id %}">삭제하기</a>
    {% endif %}

    <h2>댓글</h2>
    <p>댓글 수: {{ post.comments.count }}</p>
    {% for comment in post.comments.all %}
        <p>{{ comment.author.nickname }} : {{ comment.content }}
    {% empty %}
        댓글이 없습니다.
    {% endfor %}

    <form method="post" action="{% url 'blog:create-comment' post.id %}">
        {% csrf_token %}
        <textarea name="content" cols="30" row="5"></textarea>
        <button type="submit">댓글 작성</button><br>
    </form>
    </p>
</body>
</html>
