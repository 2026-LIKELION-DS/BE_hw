<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>덕멋 인스타그램</h1> 
    <a href = "{% url 'posts:create' %}">글 작성하기</a> <hr>
    <form method = "GET" action = "{% url 'posts:result' %}">
    <input type = "text" name = "data">
    <input type = "submit" value = "검색">
    </form>
{% for post in posts %}
    <h2><a href = "{% url 'posts:detail' post.id %}">{{ post.title }}</a></h2>
    {{ post.content }}<br>
    <br>
    조회수: {{ post.views }}<br>
    <br>
    작성일: {{ post.created_at}} <hr>
{% endfor %}

</body>
</html>
