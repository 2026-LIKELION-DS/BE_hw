<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> "{{ data }}" - 검색 결과</h1> 
    {% for result in results %}
    <h2><a href = "{% url 'posts:detail' result.id %}">{{ result.title }}</a></h2>
    {{ result.content}}
    {% empty %}
    검색된 글이 없습니다.
    {% endfor %}
</body>
</html>
