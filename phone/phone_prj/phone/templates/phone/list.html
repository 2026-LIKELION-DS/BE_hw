<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>연락처</h1>
    <form method = "GET" action = "{% url 'phone:result' %}">
        <input type="text" name="keyword">
        <button type ="submit">검색</button>
    </form>
{% for name in names %}
    <p>이름: {{ name }}</p>
    <p>번호: {{ name.phone_num }}</p>
{% empty %}
    <p>저장된 번호가 없습니다.</p>
{% endfor %}
</body>
</html>
